<a class="skip-link" href="#main">Skip to content</a>
<nav class="site-nav">
  <div class="site-nav-inner">
    <a href="/" class="site-nav-brand">Boyang Yang</a>
    <ul class="site-nav-list">
      <span class="site-nav-indicator" aria-hidden="true"></span>
      <li><a href="/" class="site-nav-link{% if page.url == '/' %} is-active{% endif %}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a></li>
      <li><a href="/publication.html" class="site-nav-link{% if page.url == '/publication.html' %} is-active{% endif %}"{% if page.url == '/publication.html' %} aria-current="page"{% endif %}>Publications</a></li>
      <li><a href="/teach.html" class="site-nav-link{% if page.url == '/teach.html' %} is-active{% endif %}"{% if page.url == '/teach.html' %} aria-current="page"{% endif %}>Teaching</a></li>
    </ul>
    <button class="theme-toggle" type="button" aria-label="Toggle color theme">
      <i class="fas fa-moon theme-icon-moon" aria-hidden="true"></i>
      <i class="fas fa-sun theme-icon-sun" aria-hidden="true"></i>
    </button>
  </div>
</nav>

<style>
.skip-link {
  position: absolute;
  left: -9999px;
  top: 8px;
  z-index: 200;
  padding: 6px 12px;
  background: var(--bg);
  border: 1px solid var(--hairline);
  border-radius: 6px;
}

.skip-link:focus {
  left: 12px;
}

.site-nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  background: var(--nav-bg, rgba(253, 252, 250, 0.85));
  -webkit-backdrop-filter: saturate(180%) blur(12px);
  backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid transparent;
  transition: border-color 0.2s ease;
}

.site-nav.is-scrolled {
  border-bottom-color: var(--hairline, #e8e5df);
}

.site-nav-inner {
  max-width: 960px;
  margin: 0 auto;
  padding: 0 24px;
  height: 56px;
  display: flex;
  align-items: center;
  gap: 16px;
}

.site-nav-brand {
  font-weight: 600;
  font-size: 1.05rem;
  letter-spacing: 0.02em;
  color: var(--accent);
  text-decoration: none;
  margin-right: auto;
}

.site-nav-brand:hover {
  color: var(--accent-strong);
  text-decoration: none;
}

.site-nav-list {
  position: relative;
  display: flex;
  list-style: none;
  margin: 0;
  padding: 4px;
  gap: 2px;
  border: 1px solid var(--hairline);
  border-radius: 999px;
}

.site-nav-list li {
  margin: 0;
}

.site-nav-indicator {
  position: absolute;
  top: 4px;
  bottom: 4px;
  left: 0;
  width: 0;
  border-radius: 999px;
  background: var(--badge-bg);
  opacity: 0;
  transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), width 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s ease;
  pointer-events: none;
}

.site-nav-link {
  position: relative;
  display: block;
  padding: 4px 14px;
  font-size: 0.95rem;
  font-weight: 500;
  letter-spacing: 0.02em;
  color: var(--muted);
  text-decoration: none;
  border-radius: 999px;
  transition: color 0.15s ease;
}

.site-nav-link:hover,
.site-nav-link.is-active {
  color: var(--accent);
  text-decoration: none;
}

.theme-toggle {
  width: 34px;
  height: 34px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--hairline);
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 0.85rem;
  transition: color 0.15s ease, border-color 0.15s ease;
}

.theme-toggle:hover {
  color: var(--accent);
  border-color: var(--accent);
}

.theme-icon-sun { display: none; }

:root[data-theme="dark"] .theme-icon-sun { display: inline; }
:root[data-theme="dark"] .theme-icon-moon { display: none; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .theme-icon-sun { display: inline; }
  :root:not([data-theme="light"]) .theme-icon-moon { display: none; }
}

@media (max-width: 560px) {
  .site-nav-inner {
    padding: 0 12px;
    gap: 8px;
  }
  .site-nav-brand {
    display: none;
  }
  .site-nav-list {
    margin-right: auto;
  }
  .site-nav-link {
    padding: 4px 10px;
    font-size: 0.9rem;
  }
}
</style>

<script>
(function () {
  var nav = document.querySelector('.site-nav');
  var list = nav.querySelector('.site-nav-list');
  var indicator = list.querySelector('.site-nav-indicator');
  var active = list.querySelector('.is-active');

  function moveTo(link) {
    if (!link) { indicator.style.opacity = 0; return; }
    indicator.style.width = link.offsetWidth + 'px';
    indicator.style.transform = 'translateX(' + link.offsetLeft + 'px)';
    indicator.style.opacity = 1;
  }

  list.querySelectorAll('.site-nav-link').forEach(function (link) {
    link.addEventListener('mouseenter', function () { moveTo(link); });
    link.addEventListener('focus', function () { moveTo(link); });
  });
  list.addEventListener('mouseleave', function () { moveTo(active); });
  window.addEventListener('resize', function () { moveTo(active); });
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { moveTo(active); });
  }
  moveTo(active);

  function onScroll() {
    nav.classList.toggle('is-scrolled', window.scrollY > 4);
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  var root = document.documentElement;
  nav.querySelector('.theme-toggle').addEventListener('click', function () {
    var dark = root.getAttribute('data-theme')
      ? root.getAttribute('data-theme') === 'dark'
      : window.matchMedia('(prefers-color-scheme: dark)').matches;
    var next = dark ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
  });
})();
</script>
