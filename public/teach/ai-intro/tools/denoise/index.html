<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>从噪声到图像</title>
  <link rel="stylesheet" href="../common/tool.css">
  <script src="../common/tool.js"></script>
  <style>
    #art { max-width: 420px; aspect-ratio: 1; image-rendering: auto; }
    .step-label { font-family: var(--font-display); font-size: var(--text-lg); font-variant-numeric: tabular-nums; }
    .pics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .credit { margin: 0; min-height: 1.4em; color: var(--text-muted); font-size: var(--text-xs); text-align: center; }
    .credit a { color: inherit; }
  </style>
</head>
<body data-title-zh="从噪声到图像" data-title-en="From Noise to Image">
  <main class="app-shell">
    <section class="workspace">
      <aside class="control-panel" aria-label="控制面板">
        <div class="field-group">
          <span class="field-label" data-en="Picture">图片</span>
          <div class="segmented pics" id="pics"></div>
        </div>
        <div class="field-group">
          <label for="step"><span data-en="Denoising step">去噪步数</span> <b id="stepVal"></b></label>
          <input id="step" type="range" min="0" max="20" step="1" value="0">
        </div>
        <div class="button-grid">
          <button type="button" class="primary" id="playBtn"></button>
          <button type="button" id="resetBtn" data-en="Back to noise">回到纯噪声</button>
        </div>
      </aside>

      <section class="maze-area">
        <div class="canvas-frame">
          <div class="step-label" id="label"></div>
          <canvas id="art" width="128" height="128"></canvas>
          <p class="credit" id="credit"></p>
        </div>
      </section>

      <aside class="info-panel" aria-label="说明">
        <div class="tips" style="margin-top:0;padding-top:0;border-top:0">
          <h2 data-en="What you are seeing">你看到的是什么</h2>
          <p data-en="An image generator starts from pure noise and removes a little at each step. Rough colors and shapes appear first, and fine details come last.">生成图片的模型从一团纯噪声出发，每一步去掉一点噪声。先出现大致的颜色和轮廓，细节最后才出现。</p>
          <p data-en="This demo moves toward a picture we already know, so you can see the idea. A real model never sees the answer. It has learned from millions of images to predict which noise to remove at each step.">这里朝一张事先选好的图逐步还原，用来示意这个过程。真实的模型看不到答案，它是从海量图片中学会了预测每一步该去掉哪些噪声。</p>
          <h2 data-en="Try this">试试看</h2>
          <p data-en="For each picture, at which step can you first tell what it is? Which pictures can you recognise earliest, and why?">每张图在第几步你开始认出是什么？哪些图最早能认出来，为什么？</p>
          <p data-en="Compare the sunflower photo with Van Gogh’s painting. At step 8, can you tell which one is the painting?">对比向日葵照片和梵高的油画《向日葵》。到第 8 步时，你能分出哪张是画吗？</p>
          <h2 data-en="Discuss">讨论</h2>
          <p data-en="Real generators often get text, hands, and counts wrong. Why might small details come out wrong when an image grows out of noise?">真实的生成模型常把文字、手指、数量画错。图像从噪声里“长出来”时，为什么小细节容易出错？</p>
        </div>
      </aside>
    </section>
  </main>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var N = 128, STEPS = 20, timer = null, clean = null, bg = [0, 0, 0], blurCache = {};
  var COMMONS = 'https://commons.wikimedia.org/wiki/File:';
  var PICS = [
    { id: 'house', zh: '小房子', en: 'House' },
    { id: 'face', zh: '笑脸', en: 'Smiley' },
    { id: 'cat', zh: '猫', en: 'Cat', src: 'img/cat.jpg', credit: ['Cat face in sunlight', 'Alicja Koczaska', 'CC0', 'Cat_face_in_sunlight_(Unsplash).jpg'] },
    { id: 'panda', zh: '熊猫', en: 'Panda', src: 'img/panda.jpg', credit: ['Giant Panda', 'Jeff Kubina', 'PD', 'Giant_Panda_2004-03-2.jpg'] },
    { id: 'strawberry', zh: '草莓', en: 'Strawberry', src: 'img/strawberry.jpg', credit: ['Strawberry fruit in studio', 'Paolo Neo', 'PD', 'Strawberry_fruit_in_studio.jpg'] },
    { id: 'sunflower', zh: '向日葵', en: 'Sunflower', src: 'img/sunflower.jpg', credit: ['Helianthus annuus', 'Jebulon', 'PD', 'Helianthus_annuusPFP.jpg'] },
    { id: 'lighthouse', zh: '灯塔', en: 'Lighthouse', src: 'img/lighthouse.jpg', credit: ['Lime Point Lighthouse', 'Radomianin', 'PD', 'Lime_Point_Lighthouse,_SW_view.jpg'] },
    { id: 'vangogh', zh: '梵高名画', en: 'Van Gogh', src: 'img/vangogh.jpg', credit: ['Sunflowers', 'Vincent van Gogh', 'PD', 'Vincent_Willem_van_Gogh_128.jpg'] }
  ];
  var pic = PICS[0], images = {};

  function color(name) {
    var p = document.createElement('span'); p.style.color = 'var(' + name + ')'; p.style.display = 'none';
    document.body.appendChild(p); var c = getComputedStyle(p).color; p.remove(); return c;
  }
  function rgb(c) { var cv = document.createElement('canvas'); cv.width = cv.height = 1; var x = cv.getContext('2d'); x.fillStyle = c; x.fillRect(0, 0, 1, 1); var d = x.getImageData(0, 0, 1, 1).data; return [d[0], d[1], d[2]]; }
  function rand(seed) { var s = seed >>> 0; return function () { s = (s + 0x6d2b79f5) >>> 0; var t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  function drawTarget() {
    var cv = document.createElement('canvas'); cv.width = cv.height = N;
    var g = cv.getContext('2d');
    if (pic.src) {
      var im = images[pic.id];
      if (!im || !im.complete) return false;
      g.drawImage(im, 0, 0, N, N);
      var d = g.getImageData(0, 0, N, N).data, s = [0, 0, 0];
      for (var i = 0; i < d.length; i += 4) { s[0] += d[i]; s[1] += d[i + 1]; s[2] += d[i + 2]; }
      bg = s.map(function (v) { return v / (N * N); });
    } else {
      var sky = color('--surface-muted'), sun = color('--tone-amber'), grass = color('--tone-green'), wall = color('--tone-sky'), roof = color('--tone-rose'), win = color('--surface'), ink = color('--foreground');
      g.scale(N / 64, N / 64);
      g.fillStyle = sky; g.fillRect(0, 0, 64, 64);
      if (pic.id === 'house') {
        g.fillStyle = sun; g.beginPath(); g.arc(50, 13, 7, 0, Math.PI * 2); g.fill();
        g.fillStyle = grass; g.fillRect(0, 50, 64, 14);
        g.fillStyle = wall; g.fillRect(16, 30, 30, 22);
        g.fillStyle = roof; g.beginPath(); g.moveTo(12, 31); g.lineTo(31, 16); g.lineTo(50, 31); g.fill();
        g.fillStyle = win; g.fillRect(27, 39, 8, 13); g.fillRect(19, 35, 6, 6); g.fillRect(38, 35, 6, 6);
      } else {
        g.fillStyle = sun; g.beginPath(); g.arc(32, 32, 24, 0, Math.PI * 2); g.fill();
        g.fillStyle = ink; g.beginPath(); g.arc(24, 26, 3.5, 0, Math.PI * 2); g.arc(40, 26, 3.5, 0, Math.PI * 2); g.fill();
        g.strokeStyle = ink; g.lineWidth = 3; g.beginPath(); g.arc(32, 34, 11, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();
      }
      bg = rgb(sky);
    }
    clean = g.getImageData(0, 0, N, N).data;
    blurCache = {};
    return true;
  }

  // Box blur, run twice, so early steps show only rough colors and shapes.
  function blur(r) {
    if (r < 1) return clean;
    if (blurCache[r]) return blurCache[r];
    var a = new Float32Array(N * N * 3), b = new Float32Array(N * N * 3), i, x, y, k;
    for (i = 0; i < N * N; i++) for (k = 0; k < 3; k++) a[i * 3 + k] = clean[i * 4 + k];
    function pass(src, dst, horiz) {
      for (var o = 0; o < N; o++) for (var c = 0; c < 3; c++) {
        var sum = 0, n = 0, j;
        for (j = -r; j <= r; j++) { var q = Math.min(N - 1, Math.max(0, j)); sum += src[(horiz ? o * N + q : q * N + o) * 3 + c]; n++; }
        for (var p = 0; p < N; p++) {
          dst[(horiz ? o * N + p : p * N + o) * 3 + c] = sum / n;
          var add = Math.min(N - 1, p + r + 1), sub = Math.max(0, p - r);
          sum += src[(horiz ? o * N + add : add * N + o) * 3 + c] - src[(horiz ? o * N + sub : sub * N + o) * 3 + c];
        }
      }
    }
    for (x = 0; x < 2; x++) { pass(a, b, true); pass(b, a, false); }
    var out = new Uint8ClampedArray(N * N * 4);
    for (i = 0; i < N * N; i++) { for (k = 0; k < 3; k++) out[i * 4 + k] = a[i * 3 + k]; out[i * 4 + 3] = 255; }
    blurCache[r] = out;
    return out;
  }

  function render() {
    var step = +$('step').value, ctx = $('art').getContext('2d');
    if (!clean) { ctx.fillStyle = '#888'; ctx.fillRect(0, 0, N, N); return; }
    var img = ctx.createImageData(N, N), r = rand(step * 97 + 5);
    var keep = Math.pow(step / STEPS, 1.3), src = blur(Math.round(12 * Math.pow(1 - step / STEPS, 1.5)));
    for (var i = 0; i < N * N * 4; i += 4) {
      for (var k = 0; k < 3; k++) img.data[i + k] = keep * src[i + k] + (1 - keep) * (0.85 * r() * 255 + 0.15 * bg[k]);
      img.data[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    $('stepVal').textContent = step + ' / ' + STEPS;
    $('label').textContent = step === 0 ? TOOL.t('第 0 步：纯噪声', 'Step 0: pure noise') : step === STEPS ? TOOL.t('第 20 步：去噪完成', 'Step 20: done') : TOOL.t('第 ' + step + ' 步', 'Step ' + step);
    var c = $('credit'); c.textContent = '';
    if (pic.credit && step === STEPS) {
      var a = document.createElement('a'); a.href = COMMONS + pic.credit[3]; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = TOOL.t('图片：', 'Image: ') + pic.credit[0] + ' · ' + pic.credit[1] + ' · ' + (pic.credit[2] === 'PD' ? TOOL.t('公有领域', 'public domain') : pic.credit[2]);
      c.appendChild(a);
    }
  }
  function buttons() {
    var box = $('pics'); box.innerHTML = '';
    PICS.forEach(function (p) {
      var b = document.createElement('button'); b.type = 'button';
      b.className = 'mode-button' + (p === pic ? ' is-active' : '');
      b.textContent = TOOL.t(p.zh, p.en);
      b.addEventListener('click', function () { pic = p; buttons(); clean = null; if (drawTarget()) render(); else render(); });
      box.appendChild(b);
    });
  }
  function stop() { if (timer) { clearInterval(timer); timer = null; } $('playBtn').textContent = TOOL.t('逐步去噪', 'Denoise step by step'); }
  function play() {
    if (timer) { stop(); return; }
    if (+$('step').value >= STEPS) $('step').value = 0;
    $('playBtn').textContent = TOOL.t('暂停', 'Pause');
    timer = setInterval(function () {
      var s = +$('step').value;
      if (s >= STEPS) { stop(); return; }
      $('step').value = s + 1; render();
    }, 220);
  }
  PICS.forEach(function (p) {
    if (!p.src) return;
    var im = new Image();
    im.onload = function () { if (pic === p) { drawTarget(); render(); } };
    im.src = p.src; images[p.id] = im;
  });
  $('step').addEventListener('input', function () { stop(); render(); });
  $('playBtn').addEventListener('click', play);
  $('resetBtn').addEventListener('click', function () { stop(); $('step').value = 0; render(); });
  TOOL.onLang(function (l, what) { buttons(); if (what === 'theme' && !pic.src) drawTarget(); render(); $('playBtn').textContent = timer ? TOOL.t('暂停', 'Pause') : TOOL.t('逐步去噪', 'Denoise step by step'); });
  buttons(); drawTarget(); render(); stop();
})();
</script>
</body>
</html>
